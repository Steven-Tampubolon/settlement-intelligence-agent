services:
  postgres:
    image: postgres:16
    container_name: langflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    restart: unless-stopped
    user: root
    depends_on:
      - postgres
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@postgres:5432/langflow
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_COMPONENTS_PATH: /app/langflow/custom_components
    volumes:
      - langflow_data:/app/langflow
      - ./langflow/components:/app/langflow/custom_components
      - ./langflow/mock_data:/app/langflow/custom_components/mock_data

volumes:
  postgres_data:
    external: true
    name: settlement-agent_langflow_data
  langflow_data:
    external: true
    name: settlement-agent_langflow_data
